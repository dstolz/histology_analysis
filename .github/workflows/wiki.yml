# Publish docs/wiki/ to the repository's GitHub wiki.
# The wiki is edited here, in docs/wiki/, and this job mirrors it on every push to main that
# touches it. Edits made directly on the wiki are overwritten by the next sync.

name: Publish wiki
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror docs/wiki into the wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R docs/wiki/. wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already matches docs/wiki."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push origin HEAD
