<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker></defs>
<rect width="1100" height="560" fill="#ffffff"/>
<rect x="20" y="30" width="190" height="80" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="115" y="50" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Zeiss acquisition</text>
<text x="115" y="68" text-anchor="middle" font-size="10.5" fill="#374151" font-family="Consolas, Menlo, monospace">.czi</text>
<text x="115" y="83" text-anchor="middle" font-size="10.5" fill="#374151">+ exported _proj _mid _composite</text>
<rect x="560" y="30" width="230" height="80" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="675" y="50" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Sidecars beside each image</text>
<text x="675" y="68" text-anchor="middle" font-size="10.5" fill="#374151" font-family="Consolas, Menlo, monospace">&lt;stem&gt;_proj_roi.roi</text>
<text x="675" y="83" text-anchor="middle" font-size="10.5" fill="#374151" font-family="Consolas, Menlo, monospace">&lt;stem&gt;_proj_values.csv</text>
<rect x="850" y="30" width="230" height="80" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="965" y="50" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Section tracker</text>
<text x="965" y="68" text-anchor="middle" font-size="10.5" fill="#374151">Google Sheet (API or published)</text>
<text x="965" y="83" text-anchor="middle" font-size="10.5" fill="#374151">or a CSV export</text>
<rect x="290" y="170" width="520" height="120" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/>
<text x="550" y="190" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">HistologyImageBrowser</text>
<text x="550" y="208" text-anchor="middle" font-size="10.5" fill="#374151">catalog • filter • view tiles and profiles</text>
<text x="550" y="223" text-anchor="middle" font-size="10.5" fill="#374151">edit / draw / add line ROIs • mark brain surface</text>
<text x="550" y="238" text-anchor="middle" font-size="10.5" fill="#374151">review: atlas plate + Measured (Sheets API only)</text>
<text x="550" y="253" text-anchor="middle" font-size="10.5" fill="#374151" font-family="Consolas, Menlo, monospace">launch_histology_browser(root, ...)</text>
<path d="M675 110 L600 168" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="659.5" y="134" text-anchor="middle" font-size="10" fill="#4b5563" font-style="italic">read</text>
<path d="M965 110 L760 168" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="922.5" y="134" text-anchor="middle" font-size="10" fill="#4b5563" font-style="italic">join by filename stem</text>
<path d="M120 110 L360 168" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="200" y="134" text-anchor="middle" font-size="10" fill="#4b5563" font-style="italic">catalog</text>
<path d="M560 168 L640 112" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="535" y="148" font-size="10" fill="#1c7ed6" font-style="italic" text-anchor="end">Save ROI rewrites .roi + values.csv,</text>
<text x="535" y="161" font-size="10" fill="#1c7ed6" font-style="italic" text-anchor="end">writes _roi_surface.json</text>
<path d="M800 190 L930 112" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="880" y="165" font-size="10" fill="#1c7ed6" font-style="italic">writes Atlas plate / Measured</text>
<rect x="290" y="340" width="520" height="70" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="550" y="360" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Table in the base workspace (one row per ROI)</text>
<text x="550" y="378" text-anchor="middle" font-size="10.5" fill="#374151">Dataset &gt; Export Selection to Workspace (Ctrl+Shift+E)</text>
<text x="550" y="393" text-anchor="middle" font-size="10.5" fill="#374151">tokens, tracker columns, ROI geometry, surface, Profile {Distance, Intensity}</text>
<path d="M550 290 L550 338" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<rect x="40" y="460" width="300" height="80" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
<text x="190" y="480" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Prepare + browse</text>
<text x="190" y="498" text-anchor="middle" font-size="10.5" fill="#374151" font-family="Consolas, Menlo, monospace">A = ecm_prepare_analysis_data(T, ...)</text>
<text x="190" y="513" text-anchor="middle" font-size="10.5" fill="#374151" font-family="Consolas, Menlo, monospace">B = launch_ecm_browser(A)</text>
<text x="190" y="528" text-anchor="middle" font-size="10.5" fill="#374151">align to surface, smooth, grid, compare</text>
<rect x="400" y="460" width="300" height="80" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="550" y="480" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Join experiment metadata (optional)</text>
<text x="550" y="498" text-anchor="middle" font-size="10.5" fill="#374151">e.g. treatment per hemisphere</text>
<text x="550" y="513" text-anchor="middle" font-size="10.5" fill="#374151">(see S_ECManalysis.m)</text>
<text x="550" y="528" text-anchor="middle" font-size="10.5" fill="#374151">save to .mat</text>
<rect x="760" y="460" width="320" height="80" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="920" y="480" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Statistics in R</text>
<text x="920" y="498" text-anchor="middle" font-size="10.5" fill="#374151" font-family="Consolas, Menlo, monospace">ecm_export_for_r(matFile, outDir)</text>
<text x="920" y="513" text-anchor="middle" font-size="10.5" fill="#374151">→ profiles.csv + sections.csv</text>
<text x="920" y="528" text-anchor="middle" font-size="10.5" fill="#374151">→ ecm_analysis.R (lme4 models, HTML report)</text>
<path d="M550 410 L550 458" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M400 500 L342 500" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M700 500 L758 500" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="550" y="556" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">Dashed arrows: files written back by the browser.</text>
</svg>